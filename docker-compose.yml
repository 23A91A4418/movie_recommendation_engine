services:
  app:
    build: .
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    # First run the main script to process data, train models, evaluate and output recommendations,
    # then start the API server to serve recommendations.
    command: ["sh", "-c", "python src/main.py && uvicorn src.api:app --host 0.0.0.0 --port 8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
